version: 2
updates:
  - package-ecosystem: gomod
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns:
          - '*'
    directories:
      - /
      - /examples/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
